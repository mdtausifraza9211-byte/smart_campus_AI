<!DOCTYPE html>
<html>
<head>
    <title>Smart Campus AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
        }

        .chat-box {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        h2 {
            color: #1e3a8a;
        }

        input {
            width: 65%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 14px 25px;
            margin-left: 10px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #162d6b;
        }

        #answer {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .services {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            flex: 1;
            text-align: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Smart Campus AI Assistant</h1>
        <p>Your digital campus helper</p>
    </header>

    <div class="container">

        <div class="chat-box">

            <h2>👋 Hello, Student!</h2>

            <p>How can I help you today?</p>

            <input
                type="text"
                id="question"
                placeholder="Ask your campus question..."
            >

            <button onclick="askQuestion()">Ask AI</button>

            <p id="answer"></p>

        </div>

        <div class="services">

            <div class="card">
                <h3>📅 Timetable</h3>
                <p>Check your class schedule.</p>
            </div>

            <div class="card">
                <h3>📢 Notices</h3>
                <p>View important college notices.</p>
            </div>

            <div class="card">
                <h3>🏫 Campus</h3>
                <p>Find classrooms and facilities.</p>
            </div>

        </div>

    </div>

    <script>
        async function askQuestion() {

            let question = document.getElementById("question").value;

            if (question === "") {
                document.getElementById("answer").innerText =
                    "Please enter a question.";
                return;
            }

            let response = await fetch("/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question
                })
            });

            let data = await response.json();

            document.getElementById("answer").innerText =
                data.answer;
        }
    </script>

</body>
</html>
